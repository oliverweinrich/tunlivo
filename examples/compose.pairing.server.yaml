name: tunlivo-server
services:
  gateway:
    image: oliverweinrich/tunlivo:1.0.2
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW, NET_BIND_SERVICE, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/run, /tmp]
    environment:
      PAIR_MODE: server
      WG_ADDRESS: '10.66.66.1/24'
      PAIR_PEER_ADDRESS: '10.66.66.2/32'
      PROXY_ROUTES: |
        tcp 8080 10.66.66.2:8080
    volumes:
      - gateway-state:/data
    ports:
      - '51820:51820/udp'
      - '51821:51821/tcp'
      - '8080:8080/tcp'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
volumes:
  gateway-state:
