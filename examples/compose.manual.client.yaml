name: tunlivo-client
services:
  gateway:
    image: oliverweinrich/tunlivo:1.0.3
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW, NET_BIND_SERVICE, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/run, /tmp]
    environment:
      WG_LISTEN_PORT: '51820'
      WG_MTU: '1420'
      WG_ADDRESS: '10.66.66.2/32'
      WG_PRIVATE_KEY: 'CLIENT_PRIVATE_KEY'
      # PUBLIC_KEY ALLOWED_IPS ENDPOINT_OR_DASH KEEPALIVE_SECONDS
      WG_PEERS: |
        SERVER_PUBLIC_KEY 10.66.66.1/32 vpn-server.example.com:51820 25
      # Targets may be service names on the same Docker network.
      PROXY_ROUTES: |
        tcp 8080 hello:80
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
  # Optional HTTP demo service; replace with your own application.
  hello:
    image: nginx:stable-alpine@sha256:970364228b1e4f932abc22d321932816782cca8a20b85a77552a7cfe9acfb3b5
    restart: unless-stopped
