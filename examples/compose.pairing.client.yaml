name: tunlivo-client
services:
  gateway:
    image: oliverweinrich/tunlivo:1.0.0
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW, NET_BIND_SERVICE, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/run, /tmp]
    environment:
      PAIR_MODE: client
      WG_ADDRESS: "10.66.66.2/32"
      PAIR_PEER_ADDRESS: "10.66.66.1/32"
      PAIR_SERVER: "vpn-server.example.com:51821"
      WG_ENDPOINT: "vpn-server.example.com:51820"
      # Replace with the complete server invitation before the first start.
      # Remove after pairing; the association is retained in the volume.
      PAIR_CODE: "COMPLETE_INVITATION_FROM_SERVER"
      PROXY_ROUTES: |
        tcp 8080 hello:80
    volumes:
      - gateway-state:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  hello:
    image: nginx:stable-alpine@sha256:970364228b1e4f932abc22d321932816782cca8a20b85a77552a7cfe9acfb3b5
    restart: unless-stopped
volumes:
  gateway-state:
