name: Publish release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tunlivo-publish
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: dockerhub
    permissions:
      contents: write
    env:
      TUNLIVO_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY || 'oliverweinrich/tunlivo' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Check formatting and development dependencies
        run: |
          npm ci --ignore-scripts
          npm run format:check
          npm audit --audit-level=high
      - name: Validate release ref and unused version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source release/common.sh
          git merge-base --is-ancestor HEAD origin/main
          if test "$GITHUB_REF_TYPE" = tag; then
            test "$GITHUB_REF_NAME" = "v$version"
          else
            test "$GITHUB_REF" = refs/heads/main
          fi
          bash release/publish.sh --check
      - uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          daemon-config: |
            { "features": { "containerd-snapshotter": true } }
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker
      - name: Prepare matching sources and licenses with fresh packages
        run: bash release/prepare.sh
      - name: Build the final multi-platform image
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --load             --build-arg VERSION="$(cat VERSION)" -t "tunlivo:$(cat VERSION)" image
          bash release/check.sh --local
      - name: Test both platforms
        run: |
          sudo modprobe wireguard
          for arch in amd64 arm64; do
            DOCKER_DEFAULT_PLATFORM="linux/$arch" bash test-integration.sh
          done
      - name: Scan the tested image for both platforms
        run: |
          for arch in amd64 arm64; do
            TUNLIVO_SCAN_REPORT="$PWD/release-output/$(cat VERSION)/trivy-$arch.json" \
              bash .github/scan.sh "tunlivo:$(cat VERSION)" "linux/$arch"
          done
      - name: Save release files for diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            release-output/*/tunlivo-*-sources.tar.gz
            release-output/*/tunlivo-*-licenses.tar.gz
            release-output/*/packages.tsv
            release-output/*/SHA256SUMS
            release-output/*/trivy-*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          : "${DOCKERHUB_USERNAME:?Set the DOCKERHUB_USERNAME variable in the dockerhub environment}"
          : "${DOCKERHUB_TOKEN:?Set the DOCKERHUB_TOKEN secret in the dockerhub environment}"
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: Publish sources, GitHub release and tested Docker images
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash release/publish.sh
      - name: Log out of Docker Hub
        if: always()
        run: docker logout
