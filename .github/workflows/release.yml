name: Publish release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tunlivo-publish
  cancel-in-progress: false
jobs:
  prepare:
    name: Prepare release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Check formatting and development dependencies
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm run test:tooling
          npm run format:check
          npm audit --audit-level=high
      - name: Validate release ref
        run: node scripts/ci.mts release-ref
      - uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          daemon-config: |
            { "features": { "containerd-snapshotter": true } }
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker
      - name: Prepare matching sources and licenses with fresh packages
        run: node release/prepare.mts
      - name: Scan source collection dependencies
        run: |
          TUNLIVO_SCAN_REPORT="$PWD/release-output/$(cat VERSION)/trivy-source-helper.json" \
            node scripts/scan.mts tunlivo-source-helper:local
      - name: Build the final multi-platform image
        run: node scripts/ci.mts build-candidate
      - name: Scan the tested image for both platforms
        run: node scripts/ci.mts scan-candidate
      - name: Save release files for diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            release-output/*/tunlivo-*-sources.tar.gz
            release-output/*/tunlivo-*-licenses.tar.gz
            release-output/*/packages.tsv
            release-output/*/SHA256SUMS
            release-output/*/trivy-*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Export the exact release candidate
        run: node scripts/ci.mts export-candidate
      - name: Transfer candidate image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image
          path: |
            candidate/image.tar
            candidate/image.tar.sha256
          compression-level: 0
          retention-days: 7
      - name: Transfer matching release state
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-state
          path: candidate/release-state.tar.gz
          compression-level: 0
          retention-days: 7
  test:
    name: Test release (${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          daemon-config: |
            { "features": { "containerd-snapshotter": true } }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-image
          path: candidate
      - name: Load and test the candidate on native hardware
        env:
          DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          node scripts/ci.mts load-candidate
          sudo modprobe wireguard
          docker run --rm --network none --read-only --tmpfs /tmp --entrypoint node "tunlivo:$(cat VERSION)" --test /opt/tunlivo/tests/runtime/pair.test.mts
          npm run test:integration
          npm run test:compatibility
  release:
    name: Publish tested release
    needs: [prepare, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: dockerhub
    permissions:
      contents: write
    env:
      TUNLIVO_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY || 'oliverweinrich/tunlivo' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          daemon-config: |
            { "features": { "containerd-snapshotter": true } }
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-image
          path: candidate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-state
          path: candidate
      - name: Validate unused version before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: node release/publish.mts --check
      - name: Restore the tested image and matching sources
        run: node scripts/ci.mts restore-release
      - name: Validate overview credentials before image publication
        env:
          DOCKERHUB_OVERVIEW_TOKEN: ${{ secrets.DOCKERHUB_OVERVIEW_TOKEN }}
        run: node scripts/ci.mts check-overview-token
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: node scripts/ci.mts docker-login
      - name: Publish sources, GitHub release and tested Docker images
        env:
          GH_TOKEN: ${{ github.token }}
        run: node release/publish.mts
      - name: Update and verify Docker Hub overview
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_OVERVIEW_TOKEN }}
        run: node .github/dockerhub.mts --output reports/dockerhub-overview.md --publish
      - name: Save generated Docker Hub overview
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dockerhub-overview
          path: reports/dockerhub-overview.md
          if-no-files-found: warn
          retention-days: 7
      - name: Log out of Docker Hub
        if: always()
        run: docker logout
