name: Update Docker Hub overview
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tunlivo-publish
  cancel-in-progress: false
jobs:
  overview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: dockerhub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Generate and update overview for the published latest version
        env:
          TUNLIVO_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY || 'oliverweinrich/tunlivo' }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_OVERVIEW_TOKEN }}
        run: node .github/dockerhub.cjs --output reports/dockerhub-overview.md --publish
      - name: Save generated overview
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dockerhub-overview
          path: reports/dockerhub-overview.md
          if-no-files-found: warn
          retention-days: 7
