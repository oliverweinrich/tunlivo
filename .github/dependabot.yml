version: 2
updates:
  - package-ecosystem: docker
    directories:
      - /image
      - /.github/scanner
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      docker-images:
        patterns: ['*']
  - package-ecosystem: docker-compose
    directory: /examples
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    ignore:
      # The release helper owns this project's version references.
      - dependency-name: oliverweinrich/tunlivo
    groups:
      example-images:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: gomod
    directory: /image/pairing
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    groups:
      formatting-tools:
        patterns: ['*']
